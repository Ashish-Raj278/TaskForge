services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT_PRODUCER: "8080"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT_WORKER: "8081"
      WORKER_COUNT: "${WORKER_COUNT:-4}"
      TASK_VISIBILITY_TIMEOUT: "${TASK_VISIBILITY_TIMEOUT:-30s}"
      TASK_RETRY_BASE_DELAY: "${TASK_RETRY_BASE_DELAY:-2s}"
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  redis-data:
